mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
tcp-concurrent: true
unified-delay: true
profile:
  store-selected: true
  store-fake-ip: true

# ==================== TUN & 嗅探 ====================
tun:
  enable: true
  stack: mixed
  mtu: 9000
  dns-hijack:
    - any:53
    - tcp://any:53
    - 0.0.0.0:53          # 额外强制劫持本地 53
  auto-detect-interface: true
  auto-route: true
  auto-redirect: true
  strict-route: true

sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  force-dns-mapping: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443]

# ==================== DNS（防泄漏强化版） ====================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  use-system-hosts: false
  prefer-h3: false
  respect-rules: true                    # 保持开启，让 DNS 也走规则
  # 强制所有 DNS 流量都经 Clash 处理
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:               # 节点域名解析用国内 DoH（快且不泄漏）
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver:                            # 默认用国内 DoH（国内网站快）
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:                              # 国外域名强制走国外 DoH（防污染+防泄漏）
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    - tls://8.8.8.8:853
  nameserver-policy:
    'geosite:cn':
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    'geosite:geolocation-!cn':
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    '+.msftconnecttest.com': system
    '+.msftncsi.com': system
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - 'time.windows.com'
    - 'time.nist.gov'
    - '*.ntp.org'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'localhost.ptlogin2.qq.com'
    - 'localhost.sec.qq.com'
    - '+.stun.*.*'
    - '+.stun.*.*.*'

# ==================== 策略组 ====================
proxy-groups:

  - name: 🚀 手动切换
    type: select
    include-all: true
    proxies:
      - ♻️ 自动选择
      - 🚀 故障轉移
      - ⚖️ 負載均衡
  # - 🤖 AI
      - DIRECT

  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🚀 故障轉移
    type: fallback
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # ===== AI 专用自动测速组（优先保证 Grok） =====
  - name: 🤖 AI
    type: select
    include-all: true
    proxies:
      - REJECT
      - 🚀 手动切换
      - ♻️ 自动选择
      - 🚀 故障轉移
      - DIRECT
    #url: https://cp.cloudflare.com/generate_204   # 轻量稳定，对 Grok / GPT / Gemini 友好
    #interval: 300
    #tolerance: 40
    # 如需进一步过滤节点可加filter: '(US|Singapore|SG|JP|Japan)' 

  - name: 🔞 Porn
    type: select
    include-all: true
    proxies:
      - REJECT
      - 🚀 手动切换
      - ♻️ 自动选择
      - 🚀 故障轉移
      - DIRECT

  - name: 🛑 广告屏蔽
    type: select
    proxies:
      - REJECT
      - 🚀 手动切换
      - ♻️ 自动选择
      - DIRECT

  - name: Microsoft
    type: select
    proxies:
      - DIRECT
      - 🚀 手动切换
      - ♻️ 自动选择

  - name: 🐟 漏网之鱼
    type: select
    include-all: true
    proxies:
      - 🚀 故障轉移
      - ♻️ 自动选择
      - 🚀 手动切换
      - DIRECT

  - name: 🎯 全球直连/版权区
    type: select
    proxies:
      - DIRECT
      - 🚀 手动切换


  - name: ⚖️ 負載均衡
    type: load-balance
    strategy: consistent-hashing
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 3600
    tolerance: 50


