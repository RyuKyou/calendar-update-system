name: Node Aggregate Update

on:
  push:
    paths:
      - 'sources/urls.txt'
      - 'scripts/update_nodes.py'
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyYAML

      - name: Fetch, probe, dedup, write clash_clean.yaml
        run: |
          python scripts/update_nodes.py --output-dir output

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No output changes to commit"
            exit 0
          fi
          git commit -m "Update nodes $(date -u +%Y-%m-%dT%H:%MZ)"
          # avoid race with concurrent pushes / other commits on main
          git pull --rebase origin main
          git push origin HEAD:main
