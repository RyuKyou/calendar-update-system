name: Node Aggregate Update

on:
  push:
    paths:
      - 'sources/urls.txt'
      - 'sources/tg_exports/**'
      - 'scripts/update_nodes.py'
  schedule:
    # After R2S probe upload (R2S recommended: 07:00 / 13:00 / 19:00 Taipei)
    # GitHub aggregate: 07:30 / 13:30 / 19:30 Taipei
    - cron: "30 23 * * *"   # 07:30 Taipei
    - cron: "30 5 * * *"    # 13:30 Taipei
    - cron: "30 11 * * *"   # 19:30 Taipei
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyYAML

      - name: Fetch, probe, dedup, write clash_clean.yaml
        run: |
          python scripts/update_nodes.py --output-dir output

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No output changes"
            exit 0
          fi
          git commit -m "Update nodes $(date -u +%Y-%m-%dT%H:%MZ)"

          git fetch origin main
          if ! git rebase origin/main; then
            git checkout --ours -- output/ 2>/dev/null || true
            git add output/
            GIT_EDITOR=true git rebase --continue || {
              echo "Rebase still failing; soft reset and recommit"
              git rebase --abort || true
              git fetch origin main
              git reset --soft origin/main
              git add output/
              git commit -m "Update nodes $(date -u +%Y-%m-%dT%H:%MZ)" || true
            }
          fi
          git push origin HEAD:main
