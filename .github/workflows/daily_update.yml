name: Node Aggregate Update

on:
  push:
    paths:
      - 'sources/urls.txt'
      - 'sources/tg_exports/**'
      - 'scripts/update_nodes.py'
      - 'scripts/deep_probe.py'
      # R2S uploads this first; then re-run aggregate with fresh path scores
      - 'output/cn_probe_results.json'
  schedule:
    # After R2S probe window (R2S: 07:00 / 13:00 / 19:00 Taipei)
    # GitHub aggregate: 07:30 / 13:30 / 19:30 Taipei
    - cron: "30 23 * * *"
    - cron: "30 5 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyYAML

      - name: Install mihomo
        run: |
          set -e
          VER=v1.19.32
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${VER}/mihomo-linux-amd64-compatible-${VER}.gz"
          curl -sL "$URL" | gunzip > /usr/local/bin/mihomo
          chmod +x /usr/local/bin/mihomo
          mihomo -v || true
          echo "MIHOMO_BIN=/usr/local/bin/mihomo" >> "$GITHUB_ENV"

      - name: Fetch, deep-probe, write clash_clean.yaml
        run: |
          python scripts/update_nodes.py --output-dir output

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Do not stage cn_probe_results.json (owned by R2S)
          git add output/candidates.json output/clash_clean.yaml output/nodes_stats.txt 2>/dev/null || true
          git add output/ || true
          git reset HEAD -- output/cn_probe_results.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No output changes"
            exit 0
          fi
          git commit -m "Update nodes $(date -u +%Y-%m-%dT%H:%MZ)"

          git fetch origin main
          if ! git rebase origin/main; then
            git checkout --ours -- output/candidates.json output/clash_clean.yaml output/nodes_stats.txt 2>/dev/null || true
            git add output/candidates.json output/clash_clean.yaml output/nodes_stats.txt 2>/dev/null || true
            GIT_EDITOR=true git rebase --continue || {
              echo "Rebase still failing; soft reset and recommit"
              git rebase --abort || true
              git fetch origin main
              git reset --soft origin/main
              git add output/candidates.json output/clash_clean.yaml output/nodes_stats.txt
              git reset HEAD -- output/cn_probe_results.json 2>/dev/null || true
              git commit -m "Update nodes $(date -u +%Y-%m-%dT%H:%MZ)" || true
            }
          fi
          git push origin HEAD:main
