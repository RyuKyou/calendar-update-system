name: Daily Calendar Update

on:
  schedule:
    # Runs at 02:00 UTC every day (adjust as needed)
    - cron: "0 2 * * *"
  workflow_dispatch:  # allow manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate stego calendar files
        env:
          STEGO_PASSWORD: ${{ secrets.STEGO_PASSWORD }}
          SUBSCRIPTION_URL: ${{ secrets.SUBSCRIPTION_URL }}
        run: |
          python scripts/encrypt_and_embed.py --output-dir output

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Update calendar media $(date -u +%Y-%m-%d)"
          git push
