name: Daily Calendar Update

on:
  push:
    paths:
      - 'sources/urls.txt'
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate stego calendar files
        env:
          STEGO_PASSWORD: ${{ secrets.STEGO_PASSWORD }}
        run: |
          python scripts/encrypt_and_embed.py --output-dir output

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Update calendar media $(date -u +%Y-%m-%d)"
          git push

      - name: Check email secrets
        run: |
          if [ -z "${{ secrets.QQ_EMAIL }}" ]; then
            echo "ERROR: Secret QQ_EMAIL is empty."
            exit 1
          fi
          if [ -z "${{ secrets.QQ_AUTH_CODE }}" ]; then
            echo "ERROR: Secret QQ_AUTH_CODE is empty."
            exit 1
          fi
          echo "Email secrets present."
          ls -lh output/

      - name: Send stego files via QQ email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.QQ_EMAIL }}
          password: ${{ secrets.QQ_AUTH_CODE }}
          subject: Ryukyou Calendar 隐写文件更新
          to: ${{ secrets.QQ_EMAIL }}
          from: Ryukyou Calendar <${{ secrets.QQ_EMAIL }}>
          body: |
            Ryukyou Calendar 每日隐写更新
            附件说明：
            - calendar.png  图片隐写（前半密文）
            - calendar.wav  音频隐写（后半密文）
            - backup_scrambled.txt  打乱Base64备份（可单独解密）
            本地用 extract_and_decrypt.py 还原。
            仓库: https://github.com/RyuKyou/calendar-update-system
          attachments: output/calendar.png,output/calendar.wav,output/backup_scrambled.txt
